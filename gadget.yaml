name: "top_syscall2"
description: Periodically report chdir syscall counts by process
homepageURL: https://github.com/mqasimsarfraz/top_syscall2
documentationURL: https://github.com/mqasimsarfraz/top_syscall2#readme
sourceURL: https://github.com/mqasimsarfraz/top_syscall2
datasources:
  calls:
    fields:
      process_id:
        annotations:
          columns.hidden: "true"
      calls:
        annotations:
          description: Chdir attempts in this fetch interval
          columns.width: "12"
          columns.alignment: right
